name: CI

on:
  push:
    branches: [main, "feat/**", "release/**"]
  pull_request:
    branches: [main]
  # Manuelles Triggern für Wartung und Recovery-Szenarien, wenn der
  # pull_request-Trigger nicht zustellt (z. B. Infrastrukturverzögerung).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gates:
    name: Quality Gates (ruff, mypy strict, pytest + cov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Verify lock file is up-to-date
        run: uv lock --check

      - name: Install dependencies from locked resolution
        run: uv sync --locked --all-groups

      - name: Verify exported JSON schemas
        run: uv run python scripts/export_schemas.py --check

      - name: Validate knowledge bundles
        run: uv run python scripts/validate_knowledge.py

      - name: Verify OpenAPI contract
        run: uv run python scripts/export_openapi.py --check

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy strict
        run: uv run mypy src tests scripts

      - name: Audit Python dependencies
        run: uv run pip-audit

      - name: Core coverage (numerology_engine ≥ 95%)
        run: uv run pytest --cov=src/numerology_engine --cov-report=term-missing --cov-fail-under=95

      - name: Total coverage (src ≥ 85%)
        run: uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=85

      - name: Verify examples match service output
        run: uv run python scripts/generate_examples.py --check

  package-smoke:
    name: Package smoke (build wheel + fresh-venv install + CLI run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Build wheel and sdist
        run: uv build

      # Muss in diesem Job laufen: der Quality-Gates-Job baut kein Wheel, dort
      # wuerde sich die Pruefung still ueberspringen und als Erfolg zaehlen.
      # NUMRA_REQUIRE_WHEEL macht ein fehlendes Wheel hier zum harten Fehler.
      - name: Verify packaged resources are present in the wheel
        env:
          NUMRA_REQUIRE_WHEEL: "1"
        run: >
          uv run --locked pytest
          tests/integration/test_production_graph.py::test_wheel_contains_prompt_templates
          -q

      - name: Install wheel in fresh venv and smoke-test
        run: |
          # --seed ships pip/setuptools into the uv-created venv so that
          # ``python -m pip install`` works (uv venv is pip-less by default).
          uv venv --python 3.12 --seed /tmp/release-venv
          /tmp/release-venv/bin/python -m pip install --upgrade pip
          /tmp/release-venv/bin/python -m pip install dist/*.whl
          /tmp/release-venv/bin/numerology --help
          /tmp/release-venv/bin/numerology version
          /tmp/release-venv/bin/numerology profile \
            --name "Max Mustermann" \
            --birth 1985-07-25 \
            --as-of-date 2026-07-26
          # v0.1.3: --as-of-date is mandatory; verify missing arg is rejected.
          ! /tmp/release-venv/bin/numerology profile \
            --name "Max Mustermann" \
            --birth 1985-07-25
          /tmp/release-venv/bin/python -c "import numerology_domain, numerology_engine, numerology_api, numerology_cli"

  web-quality:
    name: Web quality (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install uv for browser API
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12 for browser API
        run: uv python install 3.12

      - name: Install locked API runtime for browser tests
        run: uv sync --locked --no-dev

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit frontend dependencies
        # GHSA-qwww-vcr4-c8h2 only affects React Router's RSC Framework Mode.
        # Numra uses the declarative BrowserRouter library mode without server actions.
        # The available patch is React Router 8.3.0; remove the exception after that
        # major upgrade has passed Numra's compatibility and browser gates.
        run: pnpm audit --audit-level high --ignore GHSA-qwww-vcr4-c8h2

      - name: Verify generated API types
        run: |
          pnpm web:generate-api
          git diff --exit-code -- apps/web/src/api/schema.d.ts

      - name: Lint
        run: pnpm web:lint

      - name: Typecheck
        run: pnpm web:typecheck

      - name: Unit tests with coverage
        # Generates coverage/coverage-summary.json for check-build thresholds.
        run: pnpm web:coverage

      - name: Production build
        run: pnpm web:build

      - name: Verify PWA cache policy, JavaScript budget, and coverage gate
        run: pnpm web:check-build

      - name: Install Playwright browsers
        run: pnpm --filter @numra/web exec playwright install --with-deps chromium firefox webkit

      - name: Browser tests
        run: pnpm web:e2e

  container-smoke:
    name: Container build and health smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Validate deployment shell syntax
        run: |
          for file in deploy/scripts/*.sh; do
            sh -n "$file"
          done

      - name: Build pinned images
        run: docker compose build

      - name: Start private stack and await health
        run: docker compose up -d --wait --wait-timeout 60

      - name: Verify gateway and API
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/health/live
          curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/health/ready

      - name: Stop base stack before LLM-staging override
        run: docker compose down

      - name: Provision dummy runtime-marker fixtures
        run: |
          sudo mkdir -p /etc/numra
          sudo touch /etc/numra/numra-legal-approved /etc/numra/llm-transfer-approved
          sudo chown root:root /etc/numra/numra-legal-approved /etc/numra/llm-transfer-approved
          sudo chmod 600 /etc/numra/numra-legal-approved /etc/numra/llm-transfer-approved

      - name: Validate LLM-staging Compose override
        run: docker compose -f compose.yaml -f compose.llm-staging.yaml config --quiet

      - name: Start LLM-staging stack and await health
        env:
          NUMRA_LLM_ENABLED: "true"
          DEEPSEEK_API_KEY: "ci-dummy-key-not-a-real-secret"
          NUMRA_RATE_LIMIT_HMAC_SECRET: "ci-dummy-hmac-secret-not-a-real-secret-32bytes"
        run: docker compose -f compose.yaml -f compose.llm-staging.yaml up -d --wait --wait-timeout 60

      - name: Verify runtime markers are visible inside the API container
        run: |
          docker compose exec -T api python <<'PYEOF'
          from pathlib import Path

          for name in ("numra-legal-approved", "llm-transfer-approved"):
              p = Path("/etc/numra") / name
              assert p.is_file(), f"{p} not visible in container"
              st = p.stat()
              assert st.st_uid == 0 and st.st_gid == 0, f"{p} not root:root"
              assert oct(st.st_mode)[-3:] == "600", f"{p} not mode 0600"
          print("runtime markers visible and correct: OK")
          PYEOF

      - name: Verify LLM path reports enabled
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/meta \
            | python3 -c "import json,sys; body = json.load(sys.stdin); assert body['llm']['enabled'] is True, body"

      - name: Show container state on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=100

      - name: Remove test stack
        if: always()
        run: |
          docker compose -f compose.yaml -f compose.llm-staging.yaml down
          sudo rm -rf /etc/numra
