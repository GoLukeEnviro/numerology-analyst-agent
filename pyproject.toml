[project]
name = "numerology-analyst-agent"
version = "0.3.0rc1"
description = "Numra — deterministic pythagorean profile and cycle calculation core."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Numerology Analyst Agent Project" }]
keywords = ["numerology", "pythagorean", "deterministic", "audit-trace"]

# Runtime dependencies for the Walking Skeleton (Life Path A/B only).
# No network/HTTP/LLM deps — determinism before LLM (Master Contract §2.4).
dependencies = [
    "click>=8.3.3,<9.0",
    "fastapi>=0.116,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic>=2.9,<3.0",
    "typer>=0.27,<0.28",
    "uvicorn[standard]>=0.35,<1.0",
    "PyYAML>=6.0,<7.0",
    "redis>=5,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10.0",
    "pytest-cov>=5.0,<7.0",
    "hypothesis>=6.112,<7.0",
    "ruff>=0.6,<0.13",
    "mypy>=1.11,<2.0",
    "pip-audit>=2.9,<3.0",
    "types-PyYAML>=6.0,<7.0",
]

[project.scripts]
# `numerology profile --name "..." --birth YYYY-MM-DD` (Typer CLI, see src/numerology_cli/main.py).
numerology = "numerology_cli.main:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/numerology_domain",
    "src/numerology_engine",
    "src/numerology_api",
    "src/numerology_cli",
    "src/numerology_knowledge",
    "src/numerology_interpretation",
    "src/numerology_safety",
    "src/numerology_agent",
]

[tool.uv]
# Dev group exposed via `uv sync --all-groups` (Quality Gates, Master Contract §11).
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pytest>=9.1,<10.0",
    "pytest-cov>=5.0,<7.0",
    "hypothesis>=6.112,<7.0",
    "ruff>=0.6,<0.13",
    "mypy>=1.11,<2.0",
    "pip-audit>=2.9,<3.0",
    "types-PyYAML>=6.0,<7.0",
]

# --- Ruff: linting + formatting -----------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# Strict, deterministic-friendly rule set. No commented-out code, no unused imports,
# pydantic v2 aware, deterministic ordering (I002 import sorting).
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
    "TID",  # tidy imports
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["numerology_domain", "numerology_engine", "numerology_api", "numerology_cli", "numerology_knowledge", "numerology_interpretation", "numerology_safety", "numerology_agent"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- mypy: STRICT mode --------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["numerology_domain", "numerology_engine", "numerology_api", "numerology_cli", "numerology_knowledge", "numerology_interpretation", "numerology_safety", "numerology_agent"]
strict = true
warn_return_any = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
no_implicit_reexport = true
extra_checks = true

# Pydantic v2 plugin: recognizes model_validator/field_validator as typed.
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
# Tests need a touch more leniency for fixtures, but stay strict on types.
disallow_untyped_defs = false

# --- pytest + coverage --------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "golden: reference cases pinned in tests/golden/cases.yaml",
    "integration: tests across package or HTTP boundaries",
    "property: hypothesis property-based tests",
    "unit: unit tests for isolated components",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["*/__init__.py"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
